[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "span-habits"
version = "1.0.0"
description = "A quiet, native desktop habit tracker."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.gui-scripts]
span = "span_app.app:main"

[tool.setuptools.packages.find]
include = ["span_app*"]
